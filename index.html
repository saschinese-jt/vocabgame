<style>
:root{--ink:#54483f;--cream:#f6f0e7;--sage:#b8c7b7;--blue:#a5b8c9;--coral:#f36f55;--yellow:#ffd447;--paper:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Microsoft YaHei','PingFang SC',sans-serif;min-height:100vh;padding:16px;background-image:radial-gradient(#d9c6b6 1.3px,transparent 1.3px);background-size:29px 29px}button,select,input{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0 0 10px}.app{max-width:1100px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;gap:12px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:#917a70}.brand{font-size:clamp(25px,4vw,39px);font-weight:900}.sparkle{background:var(--yellow);border:3px solid var(--ink);border-radius:15px;padding:12px;box-shadow:5px 5px 0 var(--ink);font-size:26px}.panel{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:7px 8px 0 var(--ink);padding:20px}.setup{max-width:620px;margin:35px auto}.field{margin-bottom:16px}.field label{display:block;font-weight:900;margin-bottom:6px}.field select,.field input,.submit-name{width:100%;padding:12px;border:3px solid var(--ink);border-radius:12px;background:white;color:var(--ink)}.action{background:var(--coral);color:white;padding:13px 22px;border:3px solid var(--ink);border-radius:15px;box-shadow:4px 5px 0 var(--ink);font-weight:900}.action:active{transform:translate(3px,3px);box-shadow:1px 2px 0 var(--ink)}.action.secondary{background:var(--yellow);color:var(--ink)}.action[disabled]{opacity:.5;cursor:not-allowed}.small{font-size:12px;line-height:1.6;color:#74675c}.statbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:16px}.stat{background:var(--paper);border:3px solid var(--ink);border-radius:11px;padding:8px 12px;font-weight:900}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px}.board-shell{background:var(--blue);padding:14px;border:4px solid var(--ink);border-radius:23px;box-shadow:7px 8px 0 var(--ink)}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;aspect-ratio:1}.tile{border:2px solid var(--ink);border-radius:11px;box-shadow:3px 3px 0 #74665d;font-weight:900;font-size:clamp(20px,3.8vw,34px);display:grid;place-items:center;color:#433b35;min-width:0;cursor:pointer;user-select:none;touch-action:manipulation}.tile.active{background:var(--yellow)!important;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.tile.empty{visibility:hidden;pointer-events:none}.tile.wrong{background:var(--coral)!important;color:white}.tile:nth-child(5n+1){background:#f0d3c7}.tile:nth-child(5n+2){background:#dde7cf}.tile:nth-child(5n+3){background:#d4e3eb}.tile:nth-child(5n+4){background:#f7e8b7}.tile:nth-child(5n){background:#e5dae9}.learned{background:var(--sage);border:4px solid var(--ink);border-radius:22px;box-shadow:7px 8px 0 var(--ink);padding:16px;min-width:0}.pill{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:99px;padding:6px 18px;box-shadow:3px 4px 0 var(--ink);font-weight:900;margin-bottom:15px}.found-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.found-cell{min-height:68px;background:var(--paper);border:2px solid var(--ink);border-radius:11px;padding:8px 4px;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;overflow-wrap:anywhere}.found-cell strong{font-size:15px}.found-cell small{font-size:10px;color:#a77b51}.bar{border:2px solid var(--ink);height:15px;border-radius:18px;overflow:hidden;background:white;margin:12px 0 18px}.bar>div{height:100%;width:0;background:var(--coral);transition:width .2s}.progress-lessons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:16px 0}.lesson-stat{border:2px solid var(--ink);border-radius:9px;background:#eee7db;text-align:center;padding:6px 2px;font-size:11px;font-weight:800}.lesson-stat.done{background:#c5ddc5}.lesson-stat.current{background:var(--yellow)}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#332a2399;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}.overlay.show{display:flex}.dialog{width:min(430px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:25px;box-shadow:8px 9px 0 var(--ink);padding:20px;text-align:center}.dialog .meaning{text-align:left;background:#eee9dd;padding:14px;border-radius:12px;margin:12px 0;white-space:pre-wrap;line-height:1.6}.word{font-size:32px;font-weight:900}.pinyin{color:#9d6557;font-weight:800}.image-person{display:none;max-width:100%;max-height:170px;object-fit:contain;margin:10px auto;border-radius:12px}.leaderboard{margin-top:16px;background:#fff8e5;border:3px solid var(--ink);border-radius:14px;padding:14px}.leader-row{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid #d1c3ae;gap:10px}.button-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}.button-row button{flex:1}.warn{color:#a13f31}.controls{display:flex;align-items:center;gap:10px}.controls button{background:var(--yellow);border:2px solid var(--ink);border-radius:9px;padding:5px 10px}.caption{margin-top:12px}.checkpoint{background:#eef0e9;border:2px dashed #ac9e90;border-radius:12px;padding:10px;margin-top:14px}
@media(max-width:739px){body{padding:12px}.layout{grid-template-columns:1fr}.panel{padding:15px}.board-shell{padding:10px}.board{gap:6px}.found-cell{min-height:58px}.progress-lessons{grid-template-columns:repeat(3,1fr)}.tile{font-size:clamp(19px,6vw,30px)}}
</style>

<body><div class="app">
<header class="head"><div><div class="eyebrow">CHINESE WORD QUEST</div><div class="brand">让词语上场！</div></div><div class="sparkle">✦</div></header>
<section id="setup" class="panel setup">

</section>
<section id="game" class="hidden"><div class="statbar"><div class="stat" id="now-lesson"></div><div class="stat">⏰ <span id="timer">05:00</span></div><div class="stat">⭐ <span id="score">0/0</span></div><div class="controls"><button id="mute" title="开关声音">🔊</button><button id="exit">返回选课</button></div></div><div class="bar"><div id="progress"></div></div><div class="layout"><div class="board-shell"><div id="board" class="board"></div></div><section class="learned"><div class="pill">我学会了！</div><div id="found" class="found-grid"></div></section></div><p class="small caption">沿同一直线依次点击相邻汉字（横、竖或斜线）；字词顺序必须正确。阅读解释时暂停计时。</p></section>
</div>
<div class="overlay" id="study-modal"><div class="dialog"><div id="bonus-label" class="warn hidden" style="font-weight:900">✨ 答案不在本课，不过你发现了新词语！</div><button id="speak-button" class="action secondary">🔊 听发音</button><div class="word" id="study-word"></div><img id="person-image" class="image-person" alt="人物图片"><div class="pinyin" id="study-pinyin"></div><div class="meaning"><div id="study-cn"></div><div id="study-en" class="small"></div></div><button id="study-close" class="action">记住了</button></div></div>
<div class="overlay" id="result-modal"><div class="dialog"><h2 id="result-heading"></h2><div id="result-desc"></div><div class="button-row"><button id="next-button" class="action secondary">继续挑战</button><button id="back-button" class="action">返回选课</button></div><div class="leaderboard" id="submit-panel" style="display:none"><h3>🏆 十八课全通关！</h3><p>你的累计最佳时间：<strong id="total-time"></strong></p><p class="small">提交时请输入姓名或昵称；昵称和累计时间将公开显示。</p><input class="submit-name" maxlength="20" id="leader-name" autocomplete="off" placeholder="姓名 / 昵称"><button class="action" id="send-score" style="margin:10px 0">提交总排行榜</button><div id="submit-status" class="small"></div></div><div class="leaderboard"><h3>🏆 Top 10</h3><div id="result-leaders" class="small">排行榜尚未连接。</div></div></div></div>
<iframe name="score-frame" style="display:none"></iframe>
<script src="vocab.js"></script>
<script>
'use strict';
// 发布排行榜前填入你自己建立的 Google Form 与 Apps Script 地址，不能直接使用别的游戏的表单。
const LEADERBOARD_CONFIG={formAction:'',nameEntry:'',timeEntry:'',scriptUrl:''};
const STORAGE_KEY='chineseWordQuest2026_v1';
const SIZE=5, DURATION=300;
const PALETTE=[[0,1,40],[0,-1,10],[1,0,15],[-1,0,15],[1,1,5],[1,-1,5],[-1,1,5],[-1,-1,5]];
const $=id=>document.getElementById(id);
const lessons=typeof VOCAB_LESSONS!=='undefined'?VOCAB_LESSONS:[];
let progressData=loadData(),chosen=null,challengeIndex=0,targets=[],board=[],selected=[],found=[],timeLeft=DURATION,runTimer=null,paused=false,ended=false,muted=false,pendingSingle=null,bonusMode=false;
let dictionary=Object.create(null);
fetch('dictionary.json').then(r=>r.ok?r.json():{}).then(d=>{if(d&&typeof d==='object')dictionary=d}).catch(()=>{});
function loadData(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return d&&typeof d==='object'?d:{best:{},draft:null,submittedBest:null}}catch{return {best:{},draft:null,submittedBest:null}}}
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progressData))}catch{}}
const key=(l,i)=>`${l.unit}-${l.lesson}-${i}`;
function pad(n){return String(n).padStart(2,'0')}
function fmt(sec){sec=Math.max(0,Math.round(sec));return `${Math.floor(sec/60)}:${pad(sec%60)}`}
function lessonDone(l){return l.challenges.every((_,i)=>Number.isFinite(progressData.best?.[key(l,i)]))}
function allDone(){return lessons.length===18&&lessons.every(lessonDone)}
function overallTime(){return lessons.reduce((a,l)=>a+l.challenges.reduce((t,_,i)=>t+(progressData.best[key(l,i)]||0),0),0)}
function refreshJourney(){const holder=$('journey');holder.innerHTML='';lessons.forEach(l=>{const div=document.createElement('div');div.className='lesson-stat'+(lessonDone(l)?' done':'');div.textContent=`${l.unit}-${l.lesson} ${lessonDone(l)?'✓':'○'}`;holder.appendChild(div)});const count=lessons.filter(lessonDone).length;$('journey-total').textContent=`已完成 ${count}/18 课${count?' · 当前总最佳 '+fmt(overallTime()):''}`}
function fillSelect(node,entries){node.innerHTML='';entries.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;node.appendChild(o)})}
function chosenLesson(){return lessons.find(l=>l.unit===Number($('unit-select').value)&&l.lesson===Number($('lesson-select').value))}
function setUnit(){const u=Number($('unit-select').value);fillSelect($('lesson-select'),lessons.filter(l=>l.unit===u).map(l=>[l.lesson,l.title]));setLesson()}
function setLesson(){const l=chosenLesson();if(!l)return;fillSelect($('challenge-select'),l.challenges.map((g,i)=>[i,`挑战 ${i+1}（${g.length}词）`]));$('challenge-field').classList.toggle('hidden',l.challenges.length<=1);setChallenge()}
function setChallenge(){const l=chosenLesson();if(!l)return;const i=Number($('challenge-select').value)||0;const best=progressData.best[key(l,i)];$('lesson-summary').textContent=`${l.title} · ${l.challenges.length>1?'挑战'+(i+1):'单盘挑战'} · ${l.challenges[i].length}个词条${Number.isFinite(best)?' · 最佳 '+fmt(best):''}`;const draft=progressData.draft;$('resume-button').classList.toggle('hidden',!(draft&&draft.key===key(l,i)));$('resume-note').textContent=draft&&draft.key===key(l,i)?'此关有未完成的本地记录，可以继续上次挑战。':''}
function showSetup(){clearInterval(runTimer);runTimer=null;$('game').classList.add('hidden');$('result-modal').classList.remove('show');$('setup').classList.remove('hidden');refreshJourney();setChallenge();loadLeaderboard('setup-leaders')}
function selectFirst(){fillSelect($('unit-select'),[1,2,3,4,5,6].map(i=>[i,`单元${['一','二','三','四','五','六'][i-1]}`]));setUnit();if(progressData.draft){const [u,l,i]=progressData.draft.key.split('-');$('unit-select').value=u;setUnit();$('lesson-select').value=l;setLesson();$('challenge-select').value=i;setChallenge()}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pathsFor(text,occupied){const n=[...text].length,out=[];for(let a=0;a<25;a++){const r=Math.floor(a/5),c=a%5;for(const [dr,dc,w] of PALETTE){const p=[];let ok=true;for(let k=0;k<n;k++){const y=r+dr*k,x=c+dc*k;if(y<0||y>=5||x<0||x>=5){ok=false;break}const ix=y*5+x;if(occupied.has(ix)){ok=false;break}p.push(ix)}if(ok)out.push({p,weight:w})}}return out}
function allMatches(text,removed){const options=[];const n=[...text].length;for(const candidate of pathsFor(text,new Set(removed))){if(candidate.p.every((idx,j)=>board[idx].char===[...text][j]&&!board[idx].empty))options.push(candidate.p)}return options}
function boardSafe(){const opts=targets.map(v=>allMatches(v.play||v.word,[]));if(opts.some(a=>!a.length))return false;const bits=opts.map(groups=>groups.map(p=>p.reduce((m,x)=>m|(1<<x),0)));const memo=new Map(),done=(1<<targets.length)-1;function walk(found,removed){if(found===done)return true;const id=found+':'+removed;if(memo.has(id))return memo.get(id);for(let i=0;i<bits.length;i++){if(found&(1<<i))continue;let count=0;for(const mask of bits[i]){if(mask&removed)continue;count++;if(!walk(found|(1<<i),removed|mask)){memo.set(id,false);return false}}if(!count){memo.set(id,false);return false}}memo.set(id,true);return true}return walk(0,0)}
function buildBoard(){const words=shuffle([...targets]).sort((a,b)=>(b.play||b.word).length-(a.play||a.word).length);if(words.reduce((s,v)=>s+[...(v.play||v.word)].length,0)>20)throw Error('本盘字数超过上限');const fillers=[...'的一是在了我不有个他这到们中上大为国地来以成行时用后'];for(let attempt=0;attempt<450;attempt++){board=Array.from({length:25},()=>({char:fillers[Math.floor(Math.random()*fillers.length)],empty:false}));const used=new Set();let nodes=0;function place(depth){if(depth===words.length)return true;if(++nodes>18000)return false;const word=words[depth].play||words[depth].word;const opts=pathsFor(word,used);opts.forEach(o=>o.rank=-Math.log(Math.max(1e-9,Math.random()))/o.weight);opts.sort((a,b)=>a.rank-b.rank);for(const o of opts){o.p.forEach((idx,j)=>{used.add(idx);board[idx].char=[...word][j]});if(place(depth+1))return true;o.p.forEach(i=>used.delete(i))}return false}if(place(0)&&boardSafe())return true}return false}
function refreshBoard(){const el=$('board');el.innerHTML='';board.forEach((tile,i)=>{const b=document.createElement('div');b.className='tile'+(tile.empty?' empty':'')+(selected.includes(i)?' active':'');b.textContent=tile.empty?'':tile.char;b.onclick=()=>tap(i);el.appendChild(b)});$('score').textContent=`${found.length}/${targets.length}`;$('progress').style.width=(100*found.length/targets.length)+'%';$('found').innerHTML='';targets.forEach(t=>{const cell=document.createElement('div');cell.className='found-cell';cell.innerHTML='';if(found.includes(targets.indexOf(t))){const strong=document.createElement('strong');strong.textContent=t.word;cell.appendChild(strong);if(t.pinyin){const small=document.createElement('small');small.textContent=t.pinyin;cell.appendChild(small)}}else{const span=document.createElement('span');span.className='small';span.textContent='待发现';cell.appendChild(span)}$('found').appendChild(cell)})}
function snapshot(){if(ended)return;progressData.draft={key:key(chosen,challengeIndex),board:board.map(v=>({...v})),found:[...found],timeLeft};saveData()}
function start(resume=false){chosen=chosenLesson();challengeIndex=Number($('challenge-select').value)||0;targets=chosen.challenges[challengeIndex];ended=false;paused=false;selected=[];found=[];timeLeft=DURATION;const draft=progressData.draft;if(resume&&draft&&draft.key===key(chosen,challengeIndex)){board=draft.board;found=draft.found;timeLeft=draft.timeLeft}else if(!buildBoard()){alert('暂时无法生成有效棋盘，请再次点击开始挑战。');return}clearInterval(runTimer);$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('now-lesson').textContent=`${chosen.unit}-${chosen.lesson} ${chosen.title} · ${challengeIndex+1}/${chosen.challenges.length}`;refreshBoard();tickLabel();snapshot();runTimer=setInterval(()=>{if(paused||ended)return;timeLeft=Math.max(0,timeLeft-1);tickLabel();snapshot();if(timeLeft===0)finish(false)},1000)}
function tickLabel(){$('timer').textContent=fmt(timeLeft)}
function lineValid(path){if(path.length<=1)return true;const a=path[0],b=path[1],dr=Math.floor(b/5)-Math.floor(a/5),dc=b%5-a%5;if(Math.abs(dr)>1||Math.abs(dc)>1||(!dr&&!dc))return false;return path.every((p,i)=>{const r=Math.floor(a/5)+dr*i,c=a%5+dc*i;return r>=0&&r<5&&c>=0&&c<5&&p===r*5+c})}
function resetSelection(){selected=[];refreshBoard()}
function tap(i){if(paused||ended||board[i].empty)return;if(pendingSingle){clearTimeout(pendingSingle);pendingSingle=null}if(selected.includes(i)){resetSelection();return}if(selected.length&&!lineValid([...selected,i])){selected=[i]}else selected.push(i);refreshBoard();const str=selected.map(x=>board[x].char).join('');const idx=targets.findIndex((v,j)=>!found.includes(j)&&(v.play||v.word)===str);if(idx>=0){if(pendingSingle){clearTimeout(pendingSingle);pendingSingle=null}const hasLonger=targets.some((v,j)=>!found.includes(j)&&(v.play||v.word).startsWith(str)&&(v.play||v.word).length>str.length);if(hasLonger){pendingSingle=setTimeout(()=>{pendingSingle=null;accept(idx)},450)}else accept(idx);return}const prefix=targets.some((v,j)=>!found.includes(j)&&(v.play||v.word).startsWith(str));if(prefix)return;const extra=dictionary[str];if(str.length>=2&&extra&&!targets.some(t=>(t.play||t.word)===str)){showStudy({word:str,pinyin:extra.pinyin||'',cn:extra.definitions||extra.cn||'课外发现',en:extra.english||extra.en||''},true);return}wrong()}
function wrong(){paused=true;document.querySelectorAll('.tile.active').forEach(el=>el.classList.add('wrong'));setTimeout(()=>{paused=false;resetSelection()},380)}
function accept(idx){showStudy(targets[idx],false,idx)}
function showStudy(item,bonus=false,idx=-1){paused=true;bonusMode=bonus;$('bonus-label').classList.toggle('hidden',!bonus);$('study-word').textContent=item.word;$('study-pinyin').textContent=item.pinyin||'';$('study-cn').textContent=item.cn||'';$('study-en').textContent=item.en||'';$('study-en').classList.toggle('hidden',!item.en);$('person-image').style.display='none';$('person-image').removeAttribute('src');$('study-modal').classList.add('show');if(!bonus&&!found.includes(idx)){found.push(idx);refreshBoard()}$('study-close').onclick=()=>{if(!bonus){selected.forEach(i=>board[i].empty=true)}selected=[];$('study-modal').classList.remove('show');paused=false;refreshBoard();snapshot();if(found.length===targets.length&&!bonus)finish(true)};speak(item.word)}
function speak(word){if(muted||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='zh-CN';speechSynthesis.speak(u)}
function finish(success){if(ended)return;ended=true;clearInterval(runTimer);runTimer=null;const duration=DURATION-timeLeft;if(success){const k=key(chosen,challengeIndex);const best=progressData.best[k];if(!Number.isFinite(best)||duration<best)progressData.best[k]=duration}progressData.draft=null;saveData();$('result-heading').textContent=success?'🎉 挑战成功！':'⏰ 时间到了';$('result-desc').textContent=`${chosen.title} · 挑战 ${challengeIndex+1} · ${found.length}/${targets.length} 个答案${success?' · 用时 '+fmt(duration):''}`;$('result-modal').classList.add('show');$('submit-panel').style.display=allDone()?'block':'none';if(allDone())$('total-time').textContent=fmt(overallTime());loadLeaderboard('result-leaders')}
function nextChallenge(){const at=lessons.findIndex(l=>l===chosen);if(challengeIndex+1<chosen.challenges.length){$('challenge-select').value=challengeIndex+1}else if(at+1<lessons.length){const next=lessons[at+1];$('unit-select').value=next.unit;setUnit();$('lesson-select').value=next.lesson;setLesson()}showSetup()}
function leaderboardConfigured(){const c=LEADERBOARD_CONFIG;return !!(c.formAction&&c.nameEntry&&c.timeEntry&&c.scriptUrl)}
function renderLeaders(element,data){const target=$(element);target.innerHTML='';const rows=Array.isArray(data)?data:Array.isArray(data?.leaders)?data.leaders:Array.isArray(data?.leaderboard)?data.leaderboard:[];if(!rows.length){target.textContent='暂无排行榜记录';return}rows.slice(0,10).forEach((r,i)=>{const row=document.createElement('div');row.className='leader-row';const sec=Number(r.timeSeconds??r.time??r.score);row.textContent=`${i+1}. ${String(r.name??r.nickname??'匿名').slice(0,20)} — ${Number.isFinite(sec)?fmt(sec):'--'}`;target.appendChild(row)})}
async function loadLeaderboard(id){if(!LEADERBOARD_CONFIG.scriptUrl){$(id).textContent='排行榜待教师连接 Google Form / Apps Script。';return}try{const res=await fetch(LEADERBOARD_CONFIG.scriptUrl,{cache:'no-store'});if(!res.ok)throw Error('读取失败');renderLeaders(id,await res.json())}catch{$(id).textContent='排行榜暂时无法读取，请稍后再试。'}}
function submitScore(){const name=$('leader-name').value.trim(),total=overallTime();if(!allDone())return;if(!name){$('submit-status').textContent='请输入姓名或昵称。';return}if(!leaderboardConfigured()){$('submit-status').textContent='教师尚未配置排行榜提交地址；本地最佳成绩已经保存。';return}if(progressData.submittedBest!==null&&total>=progressData.submittedBest){$('submit-status').textContent='只有刷新更快的累计成绩后才能再次提交。';return}const c=LEADERBOARD_CONFIG;const f=document.createElement('form');f.method='POST';f.action=c.formAction;f.target='score-frame';f.style.display='none';for(const [key,val] of [[c.nameEntry,name],[c.timeEntry,String(total)]]){const input=document.createElement('input');input.name=key;input.value=val;f.appendChild(input)}document.body.appendChild(f);f.submit();f.remove();$('submit-status').textContent='已发送提交请求；是否成功入榜请以排行榜刷新结果为准。';// Google Form 跨域 iframe 无法验证是否真正写入，故不在此标记提交成功。
}
$('unit-select').onchange=setUnit;$('lesson-select').onchange=setLesson;$('challenge-select').onchange=setChallenge;$('start-button').onclick=()=>start(false);$('resume-button').onclick=()=>start(true);$('exit').onclick=()=>{snapshot();showSetup()};$('next-button').onclick=nextChallenge;$('back-button').onclick=showSetup;$('send-score').onclick=submitScore;$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(muted&&'speechSynthesis'in window)speechSynthesis.cancel()};$('speak-button').onclick=()=>speak($('study-word').textContent);
selectFirst();refreshJourney();loadLeaderboard('setup-leaders');
</script></body></html>
